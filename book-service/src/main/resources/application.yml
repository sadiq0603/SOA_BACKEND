server:
  port: 8081

spring:
  application:
    name: book-service

  datasource:
    url: jdbc:postgresql://localhost:5432/bibliotech_books
    username: postgres
    password: Sadiq@2007
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true

jwt:
  secret: bibliotech-super-secret-key-that-is-at-least-256-bits-long-for-hs256
  expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info